name: file_transfer_app
description: Cross-platform local file transfer app
version: 0.1.0

environment:
  sdk: "^3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.4.0
  shelf: ^1.4.1

  # Discovery
  bonsoir: ^6.0.1

  # Files & permissions
  file_picker: ^10.3.10
  permission_handler: ^12.0.1
  path_provider: ^2.1.2

  # QR fallback
  mobile_scanner: ^7.1.4
  qr_flutter: ^4.1.0

  # Security
  encrypt: ^5.0.3
  crypto: ^3.0.3

  http: ^1.6.0
  image_picker: ^1.0.7
  device_info_plus: ^10.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png

flutter_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  remove_alpha_ios: true