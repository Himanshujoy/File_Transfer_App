name: file_transfer_app
description: Cross-platform local file transfer app
version: 0.1.0

environment:
  sdk: "^3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.4.0
  shelf: ^1.4.1

  # Discovery
  bonsoir: ^5.1.0

  # Files & permissions
  file_picker: ^6.1.1
  permission_handler: ^11.3.0
  path_provider: ^2.1.2

  # QR fallback
  mobile_scanner: ^4.0.0
  qr_flutter: ^4.1.0

  # Security
  encrypt: ^5.0.3
  crypto: ^3.0.3
